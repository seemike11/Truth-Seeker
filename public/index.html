<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honest Govt App</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; max-width: 800px; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
      input { padding: 0.5rem; }
      button { padding: 0.55rem 0.8rem; cursor: pointer; }
      pre { background: #f6f8fa; padding: 1rem; overflow: auto; }
      small { color: #555; }
    </style>
  </head>
  <body>
    <h1>Honest Govt App</h1>
    <p><small>If you can see this page, the server is running.</small></p>

    <h2>Test API</h2>
    <div class="row">
      <label for="userId">User ID:</label>
      <input id="userId" value="1" />
      <button id="getUser">GET /api/users/:id</button>
      <button id="createUser">POST /api/users</button>
    </div>

    <h3>Response</h3>
    <pre id="out">(click a button)</pre>

    <script>
      const out = document.getElementById('out');
      const userId = document.getElementById('userId');

      function show(result) {
        out.textContent = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
      }

      document.getElementById('getUser').addEventListener('click', async () => {
        const res = await fetch(`/api/users/${encodeURIComponent(userId.value)}`);
        const text = await res.text();
        show({ status: res.status, body: text });
      });

      document.getElementById('createUser').addEventListener('click', async () => {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Test User' }),
        });
        const text = await res.text();
        show({ status: res.status, body: text });
      });
    </script>
  </body>
</html>
