services:
  - type: web
    name: honestgovt-app
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: CORS_ORIGIN
        value: "*"
    domains:
      - www.honestgovt.com
